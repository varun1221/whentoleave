name: deploy-service

# Spec §9.7. On push to main touching the service, build the image, push it to Artifact
# Registry, and deploy to Cloud Run with the §7 flags. Authentication is Workload Identity
# Federation: GitHub holds no long-lived service account key, only the identity of this
# repository, which cannot be copied out of a log.
#
# What this needs configured once, before the first run — see README, "Deploying the
# service". Repository *variables* (not secrets, none of these are credentials):
#   GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOY_SA, DB_USER
# Everything sensitive lives in GCP Secret Manager and is named below, never passed
# through Actions: forecast-db-url, forecast-db-password, forecast-tomtom-key,
# forecast-origin-secret, forecast-ip-hash-secret.

on:
  push:
    branches: [main]
    paths:
      - "service/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/deploy-service.yml"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Which image to build"
        type: choice
        options: [jar, native]
        default: jar

# One deploy at a time, and never cancelled halfway: a cancelled `gcloud run deploy`
# leaves a revision half-rolled-out, which is worse than a queue.
concurrency:
  group: deploy-service
  cancel-in-progress: false

permissions:
  contents: read
  # Required for Workload Identity Federation to mint the OIDC token.
  id-token: write

env:
  SERVICE: forecast-service
  # The Artifact Registry repository the image lives in, created once by the wizard.
  AR_REPO: forecast
  # Which of the two Dockerfiles builds the image. `jar` is the default because it is the
  # path step 13 verifies over HTTP, and §9.6 puts the native image strictly after that: a
  # workflow_dispatch tries `native` once, and the repository variable SERVICE_FLAVOR
  # makes it the standing choice only when a native revision has served real traffic.
  FLAVOR: ${{ inputs.flavor || vars.SERVICE_FLAVOR || 'jar' }}

jobs:
  deploy:
    # Pinned rather than ubuntu-latest, which becomes Ubuntu 26 from 2026-10-19
    # (runner-images #14748). Move all three workflows together once 26 is verified.
    runs-on: ubuntu-24.04
    # Generous because a native build is minutes of static analysis, not a javac run. The
    # jar path finishes inside five.
    timeout-minutes: 45
    # Dormant until GCP exists. Without this the first push of this file fails at the auth
    # step on a repository that has no project yet, which reads as a broken pipeline rather
    # than one waiting for an account. Set the variables below and it arms itself.
    if: vars.GCP_PROJECT_ID != ''
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          echo "IMAGE=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/$AR_REPO/$SERVICE" \
            >> "$GITHUB_ENV"

      # Tagged with the commit rather than only :latest, so a revision can be traced back
      # to a diff and a rollback names an image instead of guessing. The flavour is a tag
      # of its own as well, because :latest alone does not say which of the two it is.
      - name: Build and push image
        run: |
          case "$FLAVOR" in
            jar) dockerfile=service/Dockerfile ;;
            native) dockerfile=service/Dockerfile.native ;;
            *) echo "::error::unknown FLAVOR '$FLAVOR' — expected jar or native"; exit 1 ;;
          esac
          echo "Building $FLAVOR image from $dockerfile"
          docker build -f "$dockerfile" \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" -t "$IMAGE:$FLAVOR" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$FLAVOR"

      # The flags are §7's, and they are the cost guardrail: max-instances=2 caps what a
      # traffic spike can cost, min-instances=0 is what makes the free tier free, and the
      # region list is the only one where that tier exists at all.
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:${{ github.sha }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --max-instances=2 \
            --min-instances=0 \
            --cpu=1 \
            --memory=512Mi \
            --set-env-vars "DB_USER=${{ vars.DB_USER }}" \
            --set-secrets "DB_URL=forecast-db-url:latest,DB_PASSWORD=forecast-db-password:latest,TOMTOM_API_KEY=forecast-tomtom-key:latest,ORIGIN_SECRET=forecast-origin-secret:latest,IP_HASH_SECRET=forecast-ip-hash-secret:latest" \
            --quiet
          echo "url=$(gcloud run services describe "$SERVICE" \
            --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')" >> "$GITHUB_OUTPUT"

      # Health is exempt from the origin secret, which is exactly why it is the probe path
      # Cloud Run uses and the one thing reachable directly.
      - name: Health check
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors \
            "${{ steps.deploy.outputs.url }}/actuator/health" | tee /dev/stderr | grep -q '"status":"UP"'

      # The origin secret, verified on every deploy: the *.run.app URL bypasses Cloudflare, so a
      # request to it carries no X-Origin-Secret and must be refused. A 200 here means the
      # origin secret is not set, and therefore that anyone can reach the origin directly
      # and forge CF-Connecting-IP to mint themselves unlimited lookups. The deploy has
      # already happened by this point — this step failing is the alarm, not a rollback.
      - name: The origin must refuse a request that skipped Cloudflare
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.url }}/api/quota")
          echo "GET /api/quota directly on Cloud Run → $code"
          if [ "$code" != "403" ]; then
            echo "::error::Expected 403, got $code. forecast-origin-secret is unset or empty," \
                 "so OriginSecretFilter is trusting CF-Connecting-IP from any caller and the" \
                 "per-IP limits can be bypassed. See README, \"Deploying the service\"."
            exit 1
          fi
