name: sample

on:
  schedule:
    # Sunday 09:00 UTC ~= 02:00 PT. Actions can fire 15+ minutes late, which does not
    # matter here: we ask for forecasts of future times, so a late run samples the
    # same slots.
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "sweep (full run, commits data) | probe | spread | aggregate"
        type: choice
        default: sweep
        options: [sweep, probe, spread, aggregate]

permissions:
  contents: write

concurrency:
  group: sample
  cancel-in-progress: false

jobs:
  sample:
    # Pinned rather than ubuntu-latest, which becomes Ubuntu 26 from 2026-10-19
    # (runner-images #14748). Move all three workflows together once 26 is verified.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build sampler
        run: ./gradlew :sampler:shadowJar

      - name: Run sampler
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          MAX_CALLS: "500"
        run: java -jar sampler/build/libs/sampler.jar ${{ inputs.mode || 'sweep' }}

      - name: Commit new samples
        if: ${{ inputs.mode == '' || inputs.mode == 'sweep' || inputs.mode == 'aggregate' }}
        run: |
          git config user.name  "forecast-sampler[bot]"
          git config user.email "forecast-sampler@users.noreply.github.com"
          git add data/samples web/public/data/forecasts.json
          if git diff --cached --quiet; then
            echo "No new data — nothing to commit."
            exit 0
          fi
          git commit -m "data: weekly sweep $(date -u +%Y-%m-%d)"
          git push

      # Issue #7: the live API reads Neon, not these files, so a sweep only reaches it
      # through this import. It connects as forecast_import, which can read and add to
      # corridor and sample and nothing else (scripts/neon-import-role.sql), so a leak of
      # this credential costs junk rows in public data, never the counters or settings.
      # The importer skips rows it already has, so a failed week is caught up by the next,
      # or at once by dispatching `aggregate`, which calls no API.
      - name: Load the sweep into Neon
        if: ${{ inputs.mode == '' || inputs.mode == 'sweep' || inputs.mode == 'aggregate' }}
        env:
          DB_URL: ${{ secrets.SEED_DB_URL }}
          DB_USER: forecast_import
          DB_PASSWORD: ${{ secrets.SEED_DB_PASSWORD }}
        run: |
          if [ -z "$DB_URL" ] && [ -z "$DB_PASSWORD" ]; then
            echo "::warning::SEED_DB_URL and SEED_DB_PASSWORD are not set, so the API is not getting this sweep. See README, \"Loading each sweep into Neon\"."
            exit 0
          fi
          # One without the other is a setup mistake, not a choice to skip.
          if [ -z "$DB_URL" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::Only one of SEED_DB_URL and SEED_DB_PASSWORD is set."
            exit 1
          fi
          ./gradlew :service:bootRun --args='--import-seed --spring.profiles.active=import'
