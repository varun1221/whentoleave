spring:
  application:
    name: forecast-service

  datasource:
    # Defaults point at a local Postgres. Deployment overrides these from the
    # environment; the credentials never live in the image.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/forecast}
    username: ${DB_USER:forecast}
    password: ${DB_PASSWORD:forecast}

  jpa:
    # Flyway is the only thing allowed to change the schema. `validate` turns a
    # mismatch between the entities and the migrations into a startup failure
    # instead of a silent runtime surprise.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Cloud Run injects PORT; 8080 locally.
server:
  port: ${PORT:8080}

logging:
  level:
    org.flywaydb: INFO

forecast:
  tomtom:
    # Absent locally by default: the service then serves cache only and never spends
    # quota by accident. Injected from a secret store in deployment, never in the image.
    api-key: ${TOMTOM_API_KEY:}
    base-url: https://api.tomtom.com
  edge:
    # Cloudflare adds this as X-Origin-Secret on every request it forwards (a Transform
    # Rule). With it set, /api/** refuses anything that skipped Cloudflare and could
    # therefore have forged CF-Connecting-IP. Blank locally; a secret in deployment.
    origin-secret: ${ORIGIN_SECRET:}
  privacy:
    # Keys the HMAC that stands in for a visitor's address in ip_daily_usage, so the
    # table never holds one. Deliberately not a database column: a key kept beside the
    # hashes it keys protects nothing. Blank locally, where the counters are throwaway
    # and the service only warns; injected from a secret store in deployment.
    ip-secret: ${IP_HASH_SECRET:}
  cache:
    # A bucket younger than this is served from Postgres with zero API calls.
    ttl-days: 7
  kill-switch:
    # Trades a query per request against how long a flip takes to reach every instance.
    cache-seconds: 30
  quota:
    # §7: the application-level hard stop. There is no vendor billing cap behind it.
    daily-ceiling: 150
  lookup:
    # Weekday peaks only. 5 days x 9 hours = 45 calls to fill a cold user corridor,
    # against 91 for a full grid, which would exhaust the ceiling on the second lookup.
    weekday-hours: [6, 7, 8, 9, 10, 15, 16, 17, 18]
    # §9.4: five lookups per IP per day. Cache hits do not count — only a lookup that
    # actually calls TomTom spends one.
    per-ip-daily: 5
  search:
    # §9.5: 20 per IP per day. Separate from the lookup budget because TomTom Search
    # draws on its own freemium allowance.
    per-ip-daily: 20
    # Autocomplete fires per keystroke. Without a floor, every single letter typed is a
    # billable request.
    min-query-length: 3
    result-limit: 5
    country-set: US
    cache-ttl-hours: 24
