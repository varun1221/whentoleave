spring:
  application:
    name: forecast-service

  datasource:
    # Defaults point at a local Postgres. Deployment overrides these from the
    # environment; the credentials never live in the image.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/forecast}
    username: ${DB_USER:forecast}
    password: ${DB_PASSWORD:forecast}

  jpa:
    # Flyway is the only thing allowed to change the schema. `validate` turns a
    # mismatch between the entities and the migrations into a startup failure
    # instead of a silent runtime surprise.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Cloud Run injects PORT; 8080 locally.
server:
  port: ${PORT:8080}

logging:
  level:
    org.flywaydb: INFO

forecast:
  tomtom:
    # Absent locally by default: the service then serves cache only and never spends
    # quota by accident. Injected from a secret store in deployment, never in the image.
    api-key: ${TOMTOM_API_KEY:}
    base-url: https://api.tomtom.com
  cache:
    # A bucket younger than this is served from Postgres with zero API calls.
    ttl-days: 7
  quota:
    # §7: the application-level hard stop. There is no vendor billing cap behind it.
    daily-ceiling: 150
  lookup:
    # Weekday peaks only. 5 days x 9 hours = 45 calls to fill a cold user corridor,
    # against 91 for a full grid, which would exhaust the ceiling on the second lookup.
    weekday-hours: [6, 7, 8, 9, 10, 15, 16, 17, 18]
